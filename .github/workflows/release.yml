# Builds downloadable Tetra Studio editors for Linux and Windows.
#
# Runs when a tag such as v0.1.0 is pushed (the archives are attached to a
# GitHub release of that name) or when started by hand from the Actions tab
# (the archives are attached to the run as artifacts).
name: Release builds

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            platform: linuxbsd
            binary: godot.linuxbsd.editor.x86_64
            packages: >-
              libx11-dev libxcursor-dev libxinerama-dev libxi-dev libxrandr-dev libgl1-mesa-dev
              libglu1-mesa-dev libasound2-dev libpulse-dev libudev-dev libwayland-dev
              libxkbcommon-dev libdbus-1-dev libfontconfig-dev libgegl-dev libmlt++-dev
          - name: windows
            platform: windows
            binary: godot.windows.editor.x86_64.exe
            packages: mingw-w64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y scons pkg-config mold ${{ matrix.packages }}
          if [ "${{ matrix.platform }}" = windows ]; then
            sudo update-alternatives --set x86_64-w64-mingw32-gcc /usr/bin/x86_64-w64-mingw32-gcc-posix
            sudo update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-posix
          fi

      - name: Fetch Godot and the Kdenlive catalogs
        run: scripts/fetch-upstream.sh godot kdenlive

      - name: Build
        run: TETRA_PLATFORM=${{ matrix.platform }} scripts/build.sh compiledb=no

      - name: Package
        run: scripts/package.sh ${{ matrix.name }} upstream/godot/bin/${{ matrix.binary }}

      - uses: actions/upload-artifact@v4
        with:
          name: tetra-studio-${{ matrix.name }}
          path: dist/*

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
